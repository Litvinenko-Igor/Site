<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Top up</title>
    <link rel="stylesheet" href="/css/site-light.css">
    <style>
        .wrap{ max-width:520px; margin:0 auto; padding:60px 18px; }
        .card{ padding:18px; }
        .row{ display:flex; gap:10px; margin-top:12px; }
        input{ width:100%; padding:12px; border:1px solid var(--border); border-radius:12px; }
        button{ padding:12px 14px; border-radius:12px; border:1px solid var(--border); cursor:pointer; }
    </style>
</head>
<body>
<div class="wrap">
    <h1>➕ Top up budget</h1>

    <p>Current balance: <b th:text="${user.budget} + ' €'"></b></p>

    <input type="number" name="amount" step="0.01" min="1" placeholder="Amount (e.g. 50)" required>
    <button type="submit">Top up</button>

    <p style="margin-top:12px; color: var(--muted);">
        This is a test “toy” feature — no real payments.
    </p>

    <a href="/profile">← Back</a>

</div>
</body>
</html>
